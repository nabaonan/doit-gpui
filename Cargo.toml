[package]
name = "doit-gpui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "doit 桌面待办的 GPUI Kit 纯原生复刻版"
license = "Apache-2.0"

[dependencies]
# GPUI Kit 0.8：单一依赖带入 GPUI + gpui-base + gpui-component + 图标资产
gpui-kit = "0.8.1"

# 数据契约与持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"

# WebDAV 同步：同步阻塞 HTTP 客户端（后台线程池执行，不卡 UI），默认 tls + gzip
ureq = { version = "2.12", default-features = false, features = ["tls"] }
base64 = "0.22"

# macOS 文字渲染所需（gpui-kit 默认已通过 platform 传递启用 font-kit，
# 这里显式声明 gpui-pre-platform 以便在直接依赖时也能保证字体系统可用）
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = { version = "0.3.10", features = ["font-kit"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

