# Build Doit GPUI for every platform and publish a GitHub Release with an
# auto-generated changelog.
#
# Triggered by pushing a version tag (e.g. `git push origin v0.1.1`), which the
# `scripts/release.sh` command does for you. Artifacts are named with the
# version, and different architectures are separate packages distinguished by
# name (e.g. tag v0.1.1):
#   - macOS Apple Silicon, .dmg          -> doit-gpui-v0.1.1-macos-arm64.dmg
#   - macOS Intel x64,      .dmg         -> doit-gpui-v0.1.1-macos-x64.dmg
#   - Windows x64 (.exe),   .zip         -> doit-gpui-v0.1.1-windows-x64.zip
#   - Linux x64,            .tar.gz      -> doit-gpui-v0.1.1-linux-x64.tar.gz

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle .app and create DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP="dist/Doit.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/doit-gpui" "$APP/Contents/MacOS/doit-gpui"
          sed "s/@@VERSION@@/${VERSION#v}/" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          hdiutil create -volname "Doit" -srcfolder "$APP" -ov -format UDZO \
            "dist/doit-gpui-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/doit-gpui-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/doit-gpui.exe" "dist/doit-gpui-$ver-windows-x64.exe"
          Compress-Archive -Path "dist/doit-gpui-$ver-windows-x64.exe" -DestinationPath "dist/doit-gpui-$ver-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/doit-gpui-${{ github.ref_name }}-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libasound2-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp "target/x86_64-unknown-linux-gnu/release/doit-gpui" dist/
          cp LICENSE dist/LICENSE
          tar czf "dist/doit-gpui-${VERSION}-linux-x64.tar.gz" -C dist doit-gpui LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/doit-gpui-${{ github.ref_name }}-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release body from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "**平台**：macOS（Apple Silicon DMG + Intel DMG）、Windows x64、Linux x64"
            echo
            awk -v sec="## [v${VERSION}]" '
              $0 ~ /^## \[/ { if (seen) exit; if (index($0, sec) != 0) { seen=1; next } }
              seen { print }
            ' CHANGELOG.md
          } > release-body.md
          if [ ! -s release-body.md ]; then
            echo "（本版本暂无面向用户的变更）" > release-body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            artifacts/macos-arm64/doit-gpui-${{ github.ref_name }}-macos-arm64.dmg
            artifacts/macos-x64/doit-gpui-${{ github.ref_name }}-macos-x64.dmg
            artifacts/windows-x64/doit-gpui-${{ github.ref_name }}-windows-x64.zip
            artifacts/linux-x64/doit-gpui-${{ github.ref_name }}-linux-x64.tar.gz
